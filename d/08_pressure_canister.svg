<svg xmlns="http://www.w3.org/2000/svg" width="1001" height="980" viewBox="0 0 1001 980" role="img" aria-labelledby="08_pressure_canister-t 08_pressure_canister-d" preserveAspectRatio="xMidYMid meet"><title id="08_pressure_canister-t">The trunk as a pressure canister</title><desc id="08_pressure_canister-d">The trunk drawn as a pressure canister: the diaphragm as the lid, the abdominal wall and the spine as the walls, and the pelvic floor as the base. Pressure made during a brace is shared by all four surfaces, so what the rest of the canister does decides what the pelvic floor has to hold. It is a teaching model, not a way to assess pelvic-floor function.</desc><defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8E8E93"/></marker>
<marker id="barr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0A84FF"/></marker>
<marker id="rarr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#FF453A"/></marker>
<marker id="garr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#30D158"/></marker>
</defs><text x="50" y="70" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="42" font-weight="700" fill="#1D1D1F" text-anchor="start">The pressure canister</text><text x="50" y="110" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="23" font-weight="500" fill="#6E6E73" text-anchor="start">A coaching model: diaphragm, abdominal wall, spine and pelvic floor work as one system.</text><rect x="265" y="220" width="370" height="430" rx="90" fill="#F2F7FF" stroke="#B7CBE8" stroke-width="3"/><path d="M 310 250 Q 450 210 590 250" fill="none" stroke="#FF453A" stroke-width="12" stroke-linecap="round"/><path d="M 310 620 Q 450 660 590 620" fill="none" stroke="#BF5AF2" stroke-width="12" stroke-linecap="round"/><text x="450" y="180" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="24" font-weight="700" fill="#FF453A" text-anchor="middle">Diaphragm</text><text x="450" y="710" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="24" font-weight="700" fill="#BF5AF2" text-anchor="middle">Pelvic floor</text><text x="225" y="440" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="22" font-weight="700" fill="#6E6E73" text-anchor="end">Abdominal wall</text><text x="675" y="440" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="22" font-weight="700" fill="#6E6E73" text-anchor="start">Spine / back</text><line x1="450" y1="435" x2="450" y2="340" stroke="#0A84FF" stroke-width="7" stroke-linecap="round" marker-end="url(#barr)"/><line x1="450" y1="435" x2="450" y2="530" stroke="#0A84FF" stroke-width="7" stroke-linecap="round" marker-end="url(#barr)"/><line x1="450" y1="435" x2="340" y2="435" stroke="#0A84FF" stroke-width="7" stroke-linecap="round" marker-end="url(#barr)"/><line x1="450" y1="435" x2="560" y2="435" stroke="#0A84FF" stroke-width="7" stroke-linecap="round" marker-end="url(#barr)"/><line x1="450" y1="435" x2="375" y2="370" stroke="#0A84FF" stroke-width="7" stroke-linecap="round" marker-end="url(#barr)"/><line x1="450" y1="435" x2="525" y2="370" stroke="#0A84FF" stroke-width="7" stroke-linecap="round" marker-end="url(#barr)"/><line x1="450" y1="435" x2="375" y2="500" stroke="#0A84FF" stroke-width="7" stroke-linecap="round" marker-end="url(#barr)"/><line x1="450" y1="435" x2="525" y2="500" stroke="#0A84FF" stroke-width="7" stroke-linecap="round" marker-end="url(#barr)"/><text x="450" y="430" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="28" font-weight="800" fill="#0A84FF" text-anchor="middle">BRACE</text><rect x="55" y="755" width="370" height="155" rx="24" fill="#EEF6FF"/><text x="80" y="800" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="28" font-weight="800" fill="#0A84FF" text-anchor="start">Brace</text><text x="80" y="838" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="21" font-weight="600" fill="#6E6E73" text-anchor="start">Pressure rises throughout the</text><text x="80" y="864" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="21" font-weight="600" fill="#6E6E73" text-anchor="start">trunk and is distributed</text><text x="80" y="890" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="21" font-weight="600" fill="#6E6E73" text-anchor="start">around the canister.</text><rect x="475" y="755" width="370" height="155" rx="24" fill="#FFF1F1"/><text x="500" y="800" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="28" font-weight="800" fill="#FF453A" text-anchor="start">Bear down</text><text x="500" y="838" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="21" font-weight="600" fill="#6E6E73" text-anchor="start">Pressure is still</text><text x="500" y="864" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="21" font-weight="600" fill="#6E6E73" text-anchor="start">multidirectional, but the</text><text x="500" y="890" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="21" font-weight="600" fill="#6E6E73" text-anchor="start">pattern is biased more</text><text x="500" y="916" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="21" font-weight="600" fill="#6E6E73" text-anchor="start">towards the pelvic floor.</text><line x1="705" y1="585" x2="705" y2="543" stroke="#8E8E93" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><line x1="705" y1="585" x2="705" y2="627" stroke="#FF453A" stroke-width="9" stroke-linecap="round" marker-end="url(#rarr)"/><line x1="705" y1="585" x2="663" y2="585" stroke="#8E8E93" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><line x1="705" y1="585" x2="747" y2="585" stroke="#8E8E93" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><text x="450" y="945" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="21" font-weight="700" fill="#6E6E73" text-anchor="middle">Pressure direction cannot diagnose pelvic-floor function.</text></svg>