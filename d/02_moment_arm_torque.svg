<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="02_moment_arm_torque-t 02_moment_arm_torque-d" preserveAspectRatio="xMidYMid meet"><title id="02_moment_arm_torque-t">Moment arm through a lateral raise</title><desc id="02_moment_arm_torque-d">A lateral raise shown at points through its range, with the dumbbell's line of force and the perpendicular distance from that line to the shoulder joint marked at each. The weight does not change and the line of force does not change. The perpendicular distance does, and that is what changes the torque the shoulder has to produce.</desc><defs>
            <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1D1D1F"/></marker>
            <marker id="barr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0A84FF"/></marker>
            <marker id="rarr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#FF453A"/></marker>
            </defs><text x="210" y="80" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="34" font-weight="700" fill="#1D1D1F" text-anchor="middle">Arm down</text><circle cx="190" cy="330" r="10" fill="#1D1D1F"/><line x1="190" y1="330" x2="190.0" y2="510.0" stroke="#C7C7CC" stroke-width="24" stroke-linecap="round"/><circle cx="190.0" cy="510.0" r="26" fill="#3A3A3C"/><line x1="190.0" y1="310" x2="190.0" y2="585" stroke="#8E8E93" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 10"/><line x1="190.0" y1="525" x2="190.0" y2="585" stroke="#8E8E93" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/><text x="204" y="312" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="26" font-weight="700" fill="#FF453A" text-anchor="start">d ~ 0</text><text x="440" y="80" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="34" font-weight="700" fill="#1D1D1F" text-anchor="middle">Mid-range</text><circle cx="420" cy="330" r="10" fill="#1D1D1F"/><line x1="420" y1="330" x2="547.2792206135786" y2="457.27922061357856" stroke="#C7C7CC" stroke-width="24" stroke-linecap="round"/><circle cx="547.2792206135786" cy="457.27922061357856" r="26" fill="#3A3A3C"/><line x1="547.2792206135786" y1="310" x2="547.2792206135786" y2="585" stroke="#8E8E93" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 10"/><line x1="547.2792206135786" y1="525" x2="547.2792206135786" y2="585" stroke="#8E8E93" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/><line x1="420" y1="330" x2="547.2792206135786" y2="330" stroke="#FF453A" stroke-width="5" stroke-linecap="round"/><line x1="420" y1="318" x2="420" y2="342" stroke="#FF453A" stroke-width="3" stroke-linecap="round"/><line x1="547.2792206135786" y1="318" x2="547.2792206135786" y2="342" stroke="#FF453A" stroke-width="3" stroke-linecap="round"/><text x="700" y="80" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="34" font-weight="700" fill="#1D1D1F" text-anchor="middle">Arm horizontal</text><circle cx="680" cy="330" r="10" fill="#1D1D1F"/><line x1="680" y1="330" x2="860.0" y2="330.0" stroke="#C7C7CC" stroke-width="24" stroke-linecap="round"/><circle cx="860.0" cy="330.0" r="26" fill="#3A3A3C"/><line x1="860.0" y1="310.0" x2="860.0" y2="585" stroke="#8E8E93" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 10"/><line x1="860.0" y1="525" x2="860.0" y2="585" stroke="#8E8E93" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/><line x1="680" y1="330" x2="860.0" y2="330" stroke="#FF453A" stroke-width="5" stroke-linecap="round"/><line x1="680" y1="318" x2="680" y2="342" stroke="#FF453A" stroke-width="3" stroke-linecap="round"/><line x1="860.0" y1="318" x2="860.0" y2="342" stroke="#FF453A" stroke-width="3" stroke-linecap="round"/><text x="450" y="660" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="32" font-weight="700" fill="#0A84FF" text-anchor="middle">torque = force x perpendicular moment arm</text></svg>