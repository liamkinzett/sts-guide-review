<svg xmlns="http://www.w3.org/2000/svg" width="1101" height="860" viewBox="0 0 1101 860" role="img" aria-labelledby="06_adaptation_timelines-t 06_adaptation_timelines-d" preserveAspectRatio="xMidYMid meet"><title id="06_adaptation_timelines-t">Overlapping adaptation timelines</title><desc id="06_adaptation_timelines-d">Overlapping bars for the nervous system, muscle, tendon and ligament, and bone. All of them begin responding to training from the start, but they reach measurable change at different rates, with bone slowest by a wide margin. Different rates, not separate stages.</desc><defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8E8E93"/></marker>
<marker id="barr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0A84FF"/></marker>
<marker id="rarr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#FF453A"/></marker>
<marker id="garr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#30D158"/></marker>
</defs><text x="50" y="70" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="42" font-weight="700" fill="#1D1D1F" text-anchor="start">Overlapping adaptation timelines</text><text x="50" y="110" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="24" font-weight="500" fill="#6E6E73" text-anchor="start">All begin responding early. What differs is the rate and when change becomes easy to measure.</text><line x1="260" y1="700" x2="825" y2="700" stroke="#8E8E93" stroke-width="3" marker-end="url(#arr)"/><line x1="260" y1="692" x2="260" y2="708" stroke="#8E8E93" stroke-width="2"/><text x="260" y="742" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="20" font-weight="600" fill="#6E6E73" text-anchor="middle">start</text><line x1="405" y1="692" x2="405" y2="708" stroke="#8E8E93" stroke-width="2"/><text x="405" y="742" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="20" font-weight="600" fill="#6E6E73" text-anchor="middle">weeks</text><line x1="585" y1="692" x2="585" y2="708" stroke="#8E8E93" stroke-width="2"/><text x="585" y="742" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="20" font-weight="600" fill="#6E6E73" text-anchor="middle">months</text><line x1="770" y1="692" x2="770" y2="708" stroke="#8E8E93" stroke-width="2"/><text x="770" y="742" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="20" font-weight="600" fill="#6E6E73" text-anchor="middle">longer term</text><text x="55" y="191" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="25" font-weight="700" fill="#1D1D1F" text-anchor="start">Nervous system / skill</text><path d="M 260 185 C 360 181, 715 162, 825 157" fill="none" stroke="#0A84FF" stroke-width="12" stroke-linecap="round" opacity="0.32"/><path d="M 260 185 C 335 182, 459.25 169, 514.25 166" fill="none" stroke="#0A84FF" stroke-width="12" stroke-linecap="round"/><circle cx="429.5" cy="163" r="9" fill="#FFFFFF" stroke="#0A84FF" stroke-width="5"/><text x="445.5" y="170" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="17" font-weight="700" fill="#0A84FF" text-anchor="start">measurable</text><text x="55" y="227" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="19" font-weight="500" fill="#6E6E73" text-anchor="start">rapid early change</text><text x="55" y="301" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="25" font-weight="700" fill="#1D1D1F" text-anchor="start">Muscle</text><path d="M 260 295 C 360 291, 715 272, 825 267" fill="none" stroke="#BF5AF2" stroke-width="12" stroke-linecap="round" opacity="0.32"/><path d="M 260 295 C 335 292, 459.25 279, 514.25 276" fill="none" stroke="#BF5AF2" stroke-width="12" stroke-linecap="round"/><circle cx="553.8" cy="273" r="9" fill="#FFFFFF" stroke="#BF5AF2" stroke-width="5"/><text x="569.8" y="280" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="17" font-weight="700" fill="#BF5AF2" text-anchor="start">measurable</text><text x="55" y="337" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="19" font-weight="500" fill="#6E6E73" text-anchor="start">measurable growth over weeks–months</text><text x="55" y="411" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="25" font-weight="700" fill="#1D1D1F" text-anchor="start">Tendon</text><path d="M 260 405 C 360 401, 715 382, 825 377" fill="none" stroke="#30D158" stroke-width="12" stroke-linecap="round" opacity="0.32"/><path d="M 260 405 C 335 402, 459.25 389, 514.25 386" fill="none" stroke="#30D158" stroke-width="12" stroke-linecap="round"/><circle cx="638.55" cy="383" r="9" fill="#FFFFFF" stroke="#30D158" stroke-width="5"/><text x="654.55" y="390" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="17" font-weight="700" fill="#30D158" text-anchor="start">measurable</text><text x="55" y="447" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="19" font-weight="500" fill="#6E6E73" text-anchor="start">mechanical remodelling over weeks–months</text><text x="55" y="521" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="25" font-weight="700" fill="#1D1D1F" text-anchor="start">Ligament</text><path d="M 260 515 C 360 511, 715 492, 825 487" fill="none" stroke="#FF9F0A" stroke-width="12" stroke-linecap="round" opacity="0.32"/><path d="M 260 515 C 335 512, 459.25 499, 514.25 496" fill="none" stroke="#FF9F0A" stroke-width="12" stroke-linecap="round"/><circle cx="672.45" cy="493" r="9" fill="#FFFFFF" stroke="#FF9F0A" stroke-width="5"/><text x="688.45" y="500" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="17" font-weight="700" fill="#FF9F0A" text-anchor="start">measurable</text><text x="55" y="557" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="19" font-weight="500" fill="#6E6E73" text-anchor="start">load responsive; timing less certain</text><text x="55" y="631" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="25" font-weight="700" fill="#1D1D1F" text-anchor="start">Bone</text><path d="M 260 625 C 360 621, 715 602, 825 597" fill="none" stroke="#FF453A" stroke-width="12" stroke-linecap="round" opacity="0.32"/><path d="M 260 625 C 335 622, 459.25 609, 514.25 606" fill="none" stroke="#FF453A" stroke-width="12" stroke-linecap="round"/><circle cx="723.3" cy="603" r="9" fill="#FFFFFF" stroke="#FF453A" stroke-width="5"/><text x="739.3" y="610" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="17" font-weight="700" fill="#FF453A" text-anchor="start">measurable</text><text x="55" y="667" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="19" font-weight="500" fill="#6E6E73" text-anchor="start">meaningful structural change slower</text><rect x="60" y="765" width="780" height="56" rx="18" fill="#F7F7FA"/><text x="450" y="801" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="22" font-weight="700" fill="#1D1D1F" text-anchor="middle">Different rates ≠ separate stages. The curves are conceptual, not to scale.</text></svg>