<svg xmlns="http://www.w3.org/2000/svg" width="986" height="1510" viewBox="0 0 986 1510" role="img" aria-labelledby="09_pregnancy_pathway-t 09_pregnancy_pathway-d" preserveAspectRatio="xMidYMid meet"><title id="09_pregnancy_pathway-t">Pregnancy coaching pathway</title><desc id="09_pregnancy_pathway-d">A decision pathway for coaching a pregnant client, with separate branches for a medical stop sign, a pelvic-floor symptom that needs referral, ordinary movement discomfort or a visible load-transfer issue, and reduced capacity from fatigue or nausea. If none of those apply, training continues under the standard pregnancy model. It is an orientation map, not the full protocol.</desc><defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8E8E93"/></marker>
<marker id="barr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0A84FF"/></marker>
<marker id="rarr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#FF453A"/></marker>
<marker id="garr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#30D158"/></marker>
</defs><text x="50" y="68" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="42" font-weight="700" fill="#1D1D1F" text-anchor="start">Pregnancy coaching pathway</text><text x="50" y="108" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="22" font-weight="500" fill="#6E6E73" text-anchor="start">Orientation only. The detailed stop lists and contraindications stay in the relevant pages.</text><rect x="230" y="145" width="440" height="78" rx="24" fill="#EAF4FF"/><text x="450.0" y="187" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="24" font-weight="750" fill="#1D1D1F" text-anchor="middle">Pregnant client</text><line x1="450" y1="223" x2="450" y2="260" stroke="#8E8E93" stroke-width="3" marker-end="url(#arr)"/><rect x="95" y="270" width="560" height="110" rx="24" fill="#F7F7FA"/><text x="375.0" y="312" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="24" font-weight="750" fill="#1D1D1F" text-anchor="middle">Absolute contraindication</text><text x="375.0" y="343" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="24" font-weight="750" fill="#1D1D1F" text-anchor="middle">present?</text><text x="375.0" y="379" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="18" font-weight="550" fill="#6E6E73" text-anchor="middle">Training is ruled out while the</text><text x="375.0" y="403" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="18" font-weight="550" fill="#6E6E73" text-anchor="middle">condition is present.</text><text x="695" y="320" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="20" font-weight="800" fill="#FF453A" text-anchor="start">YES</text><line x1="655" y1="325" x2="735" y2="325" stroke="#8E8E93" stroke-width="3" marker-end="url(#arr)"/><rect x="740" y="270" width="125" height="110" rx="24" fill="#FFF0F0"/><text x="802.5" y="312" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="24" font-weight="750" fill="#FF453A" text-anchor="middle">TRAINING STOPS</text><text x="802.5" y="348" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="18" font-weight="550" fill="#6E6E73" text-anchor="middle">medical / obstetric management</text><text x="470" y="410" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="20" font-weight="800" fill="#30D158" text-anchor="start">NO</text><line x1="450" y1="380" x2="450" y2="445" stroke="#8E8E93" stroke-width="3" marker-end="url(#arr)"/><rect x="95" y="455" width="560" height="110" rx="24" fill="#F7F7FA"/><text x="375.0" y="497" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="24" font-weight="750" fill="#1D1D1F" text-anchor="middle">Pregnancy stop sign during a</text><text x="375.0" y="528" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="24" font-weight="750" fill="#1D1D1F" text-anchor="middle">session?</text><text x="375.0" y="564" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="18" font-weight="550" fill="#6E6E73" text-anchor="middle">End this session and contact</text><text x="375.0" y="588" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="18" font-weight="550" fill="#6E6E73" text-anchor="middle">obstetrician, GP or midwife.</text><text x="695" y="505" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="20" font-weight="800" fill="#FF453A" text-anchor="start">YES</text><line x1="655" y1="510" x2="735" y2="510" stroke="#8E8E93" stroke-width="3" marker-end="url(#arr)"/><rect x="740" y="455" width="125" height="110" rx="24" fill="#FFF0F0"/><text x="802.5" y="497" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="24" font-weight="750" fill="#FF453A" text-anchor="middle">END SESSION</text><text x="802.5" y="533" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="18" font-weight="550" fill="#6E6E73" text-anchor="middle">contact medical team</text><text x="470" y="595" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="20" font-weight="800" fill="#30D158" text-anchor="start">NO</text><line x1="450" y1="565" x2="450" y2="630" stroke="#8E8E93" stroke-width="3" marker-end="url(#arr)"/><rect x="95" y="640" width="560" height="120" rx="24" fill="#F7F7FA"/><text x="375.0" y="682" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="24" font-weight="750" fill="#1D1D1F" text-anchor="middle">Pelvic-floor symptoms?</text><text x="375.0" y="718" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="18" font-weight="550" fill="#6E6E73" text-anchor="middle">Leaking, heaviness, dragging or</text><text x="375.0" y="742" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="18" font-weight="550" fill="#6E6E73" text-anchor="middle">pain with intercourse.</text><text x="695" y="695" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="20" font-weight="800" fill="#FF9F0A" text-anchor="start">YES</text><line x1="655" y1="700" x2="735" y2="700" stroke="#8E8E93" stroke-width="3" marker-end="url(#arr)"/><rect x="740" y="640" width="125" height="120" rx="24" fill="#FFF7E6"/><text x="802.5" y="682" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="24" font-weight="750" fill="#FF9F0A" text-anchor="middle">STOP + REFER</text><text x="802.5" y="718" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="18" font-weight="550" fill="#6E6E73" text-anchor="middle">pelvic health physio</text><text x="470" y="790" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="20" font-weight="800" fill="#30D158" text-anchor="start">NO</text><line x1="450" y1="760" x2="450" y2="825" stroke="#8E8E93" stroke-width="3" marker-end="url(#arr)"/><rect x="95" y="835" width="560" height="120" rx="24" fill="#F7F7FA"/><text x="375.0" y="877" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="24" font-weight="750" fill="#1D1D1F" text-anchor="middle">Movement discomfort or</text><text x="375.0" y="908" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="24" font-weight="750" fill="#1D1D1F" text-anchor="middle">visible load-transfer issue?</text><text x="375.0" y="944" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="18" font-weight="550" fill="#6E6E73" text-anchor="middle">Modify or swap the movement. Refer</text><text x="375.0" y="968" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="18" font-weight="550" fill="#6E6E73" text-anchor="middle">where indicated.</text><text x="695" y="890" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="20" font-weight="800" fill="#FF9F0A" text-anchor="start">YES</text><line x1="655" y1="895" x2="735" y2="895" stroke="#8E8E93" stroke-width="3" marker-end="url(#arr)"/><rect x="740" y="835" width="125" height="120" rx="24" fill="#FFF7E6"/><text x="802.5" y="877" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="24" font-weight="750" fill="#FF9F0A" text-anchor="middle">MODIFY</text><text x="802.5" y="913" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="18" font-weight="550" fill="#6E6E73" text-anchor="middle">monitor / refer if needed</text><text x="470" y="985" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="20" font-weight="800" fill="#30D158" text-anchor="start">NO</text><line x1="450" y1="955" x2="450" y2="1020" stroke="#8E8E93" stroke-width="3" marker-end="url(#arr)"/><rect x="95" y="1030" width="560" height="120" rx="24" fill="#F7F7FA"/><text x="375.0" y="1072" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="24" font-weight="750" fill="#1D1D1F" text-anchor="middle">First-trimester fatigue or</text><text x="375.0" y="1103" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="24" font-weight="750" fill="#1D1D1F" text-anchor="middle">nausea limiting capacity?</text><text x="375.0" y="1139" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="18" font-weight="550" fill="#6E6E73" text-anchor="middle">Reduce sets and reps first. Keep</text><text x="375.0" y="1163" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="18" font-weight="550" fill="#6E6E73" text-anchor="middle">the effort anchor.</text><text x="695" y="1085" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="20" font-weight="800" fill="#0A84FF" text-anchor="start">YES</text><line x1="655" y1="1090" x2="735" y2="1090" stroke="#8E8E93" stroke-width="3" marker-end="url(#arr)"/><rect x="740" y="1030" width="125" height="120" rx="24" fill="#EEF6FF"/><text x="802.5" y="1072" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="24" font-weight="750" fill="#0A84FF" text-anchor="middle">REDUCE DOSE</text><text x="802.5" y="1108" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="18" font-weight="550" fill="#6E6E73" text-anchor="middle">fewer sets / reps</text><text x="470" y="1180" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="20" font-weight="800" fill="#30D158" text-anchor="start">NO</text><line x1="450" y1="1150" x2="450" y2="1215" stroke="#8E8E93" stroke-width="3" marker-end="url(#arr)"/><rect x="170" y="1225" width="560" height="135" rx="24" fill="#EAF8EF"/><text x="450.0" y="1267" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="24" font-weight="750" fill="#30D158" text-anchor="middle">Continue under the standard</text><text x="450.0" y="1298" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="24" font-weight="750" fill="#30D158" text-anchor="middle">pregnancy model</text><text x="450.0" y="1334" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="18" font-weight="550" fill="#6E6E73" text-anchor="middle">2–3 RIR. Load follows capacity.</text><text x="450.0" y="1358" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="18" font-weight="550" fill="#6E6E73" text-anchor="middle">The calendar is a watch-list, not</text><text x="450.0" y="1382" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="18" font-weight="550" fill="#6E6E73" text-anchor="middle">a prescription.</text><rect x="80" y="1405" width="740" height="60" rx="20" fill="#F7F7FA"/><text x="450" y="1443" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="20" font-weight="700" fill="#6E6E73" text-anchor="middle">This diagram orients the coach; it does not replace T-05.9 or T-05.15.</text></svg>