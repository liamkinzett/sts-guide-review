<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-labelledby="04_muscle_to_sarcomere-t 04_muscle_to_sarcomere-d" preserveAspectRatio="xMidYMid meet"><title id="04_muscle_to_sarcomere-t">From whole muscle to sarcomere</title><desc id="04_muscle_to_sarcomere-d">Muscle structure drawn from the outside in: whole muscle, fascicle, muscle fibre, myofibril, sarcomere, and the actin and myosin filaments inside one sarcomere. Each level is made of many of the level below it.</desc><defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8E8E93"/></marker>
<marker id="barr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0A84FF"/></marker>
<marker id="rarr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#FF453A"/></marker>
<marker id="garr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#30D158"/></marker>
</defs><text x="50" y="70" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="42" font-weight="700" fill="#1D1D1F" text-anchor="start">From muscle to sarcomere</text><text x="50" y="110" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="25" font-weight="500" fill="#6E6E73" text-anchor="start">A structural hierarchy: each level sits inside the one before it</text><rect x="70" y="180" width="150" height="92" rx="46.0" fill="#F7B0B0" stroke="#C86B6B" stroke-width="2"/><text x="145.0" y="330" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="24" font-weight="700" fill="#1D1D1F" text-anchor="middle">Muscle</text><text x="145.0" y="360" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="19" font-weight="500" fill="#6E6E73" text-anchor="middle">organ</text><line x1="228" y1="226.0" x2="227" y2="237.5" stroke="#8E8E93" stroke-width="3" marker-end="url(#arr)"/><rect x="235" y="205" width="130" height="65" rx="32.5" fill="#F4A4A4" stroke="#C86B6B" stroke-width="2"/><text x="300.0" y="330" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="24" font-weight="700" fill="#1D1D1F" text-anchor="middle">Fascicle</text><text x="300.0" y="360" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="19" font-weight="500" fill="#6E6E73" text-anchor="middle">bundle of fibres</text><line x1="373" y1="237.5" x2="382" y2="238.0" stroke="#8E8E93" stroke-width="3" marker-end="url(#arr)"/><rect x="390" y="218" width="120" height="40" rx="20.0" fill="#EE9797" stroke="#C86B6B" stroke-width="2"/><text x="450.0" y="330" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="24" font-weight="700" fill="#1D1D1F" text-anchor="middle">Muscle fibre</text><text x="450.0" y="360" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="19" font-weight="500" fill="#6E6E73" text-anchor="middle">single muscle cell</text><line x1="518" y1="238.0" x2="527" y2="239.0" stroke="#8E8E93" stroke-width="3" marker-end="url(#arr)"/><rect x="535" y="228" width="115" height="22" rx="11.0" fill="#E78A8A" stroke="#C86B6B" stroke-width="2"/><text x="592.5" y="330" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="24" font-weight="700" fill="#1D1D1F" text-anchor="middle">Myofibril</text><text x="592.5" y="360" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="19" font-weight="500" fill="#6E6E73" text-anchor="middle">contractile strand</text><line x1="658" y1="239.0" x2="672" y2="239.5" stroke="#8E8E93" stroke-width="3" marker-end="url(#arr)"/><rect x="680" y="212" width="150" height="55" rx="12" fill="#FFF1F1" stroke="#C86B6B" stroke-width="2"/><line x1="694" y1="202" x2="694" y2="277" stroke="#1D1D1F" stroke-width="3"/><line x1="816" y1="202" x2="816" y2="277" stroke="#1D1D1F" stroke-width="3"/><text x="755.0" y="330" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="24" font-weight="700" fill="#1D1D1F" text-anchor="middle">Sarcomere</text><text x="755.0" y="360" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="19" font-weight="500" fill="#6E6E73" text-anchor="middle">repeating unit</text><rect x="60" y="420" width="780" height="390" rx="28" fill="#F7F7FA"/><text x="90" y="470" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="30" font-weight="700" fill="#1D1D1F" text-anchor="start">Inside one sarcomere</text><line x1="120" y1="520" x2="120" y2="680" stroke="#1D1D1F" stroke-width="4"/><line x1="590" y1="520" x2="590" y2="680" stroke="#1D1D1F" stroke-width="4"/><text x="120" y="510" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="20" font-weight="600" fill="#6E6E73" text-anchor="middle">Z-disc</text><text x="590" y="510" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="20" font-weight="600" fill="#6E6E73" text-anchor="middle">Z-disc</text><line x1="120" y1="560" x2="350" y2="560" stroke="#0A84FF" stroke-width="8" stroke-linecap="round"/><line x1="590" y1="560" x2="360" y2="560" stroke="#0A84FF" stroke-width="8" stroke-linecap="round"/><line x1="120" y1="640" x2="350" y2="640" stroke="#0A84FF" stroke-width="8" stroke-linecap="round"/><line x1="590" y1="640" x2="360" y2="640" stroke="#0A84FF" stroke-width="8" stroke-linecap="round"/><line x1="275" y1="585" x2="435" y2="585" stroke="#FF453A" stroke-width="11" stroke-linecap="round"/><line x1="275" y1="615" x2="435" y2="615" stroke="#FF453A" stroke-width="11" stroke-linecap="round"/><text x="235" y="710" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="22" font-weight="700" fill="#0A84FF" text-anchor="middle">Actin (thin filament)</text><text x="390" y="745" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="22" font-weight="700" fill="#FF453A" text-anchor="middle">Myosin (thick filament)</text><rect x="625" y="520" width="180" height="205" rx="24" fill="#FFFFFF"/><text x="650" y="565" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="27" font-weight="700" fill="#0A84FF" text-anchor="start">Hypertrophy</text><text x="650" y="610" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="22" font-weight="600" fill="#6E6E73" text-anchor="start">Existing muscle fibres</text><text x="650" y="637" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="22" font-weight="600" fill="#6E6E73" text-anchor="start">become larger. The</text><text x="650" y="664" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="22" font-weight="600" fill="#6E6E73" text-anchor="start">muscle does not need</text><text x="650" y="691" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="22" font-weight="600" fill="#6E6E73" text-anchor="start">to gain new fibres for</text><text x="650" y="718" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="22" font-weight="600" fill="#6E6E73" text-anchor="start">hypertrophy.</text><text x="450" y="850" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="22" font-weight="600" fill="#6E6E73" text-anchor="middle">Structure only — not to scale</text></svg>