<svg xmlns="http://www.w3.org/2000/svg" width="900" height="820" viewBox="0 0 900 820" role="img" aria-labelledby="01_motor_unit_recruitment-t 01_motor_unit_recruitment-d" preserveAspectRatio="xMidYMid meet"><title id="01_motor_unit_recruitment-t">Motor-unit recruitment under a heavy load and a light load</title><desc id="01_motor_unit_recruitment-d">Motor-unit recruitment diagram comparing a heavy set with a light set. Heavy loading recruits a large share of the motor-unit pool from the first rep. Lighter loading starts with the small units and recruits progressively larger ones only as fatigue builds through the set, so the big units are reached near failure.</desc><defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8E8E93"/></marker>
<marker id="barr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0A84FF"/></marker>
<marker id="rarr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#FF453A"/></marker>
<marker id="garr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#30D158"/></marker>
</defs><text x="50" y="72" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="42" font-weight="700" fill="#1D1D1F" text-anchor="start">Motor-unit recruitment across a set</text><text x="50" y="112" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="25" font-weight="500" fill="#6E6E73" text-anchor="start">Schematic: recruitment pattern, not a motor-unit count</text><rect x="45" y="145" width="390" height="545" rx="28" fill="#F7F7FA"/><text x="70" y="195" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="32" font-weight="700" fill="#1D1D1F" text-anchor="start">Heavy load</text><text x="70" y="230" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="22" font-weight="500" fill="#6E6E73" text-anchor="start">High force demand from the start</text><rect x="465" y="145" width="390" height="545" rx="28" fill="#F7F7FA"/><text x="490" y="195" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="32" font-weight="700" fill="#1D1D1F" text-anchor="start">Lighter load</text><text x="490" y="230" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="22" font-weight="500" fill="#6E6E73" text-anchor="start">Recruitment rises as fatigue builds</text><circle cx="80" cy="715" r="13" fill="#0A84FF"/><text x="105" y="723" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="20" font-weight="600" fill="#6E6E73" text-anchor="start">Low-threshold group</text><circle cx="345" cy="715" r="13" fill="#BF5AF2"/><text x="370" y="723" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="20" font-weight="600" fill="#6E6E73" text-anchor="start">Medium-threshold group</text><circle cx="610" cy="715" r="13" fill="#FF453A"/><text x="635" y="723" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="20" font-weight="600" fill="#6E6E73" text-anchor="start">High-threshold group</text><text x="450" y="775" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="25" font-weight="700" fill="#0A84FF" text-anchor="middle">Load can create the demand immediately. Fatigue can create it progressively.</text><text x="75" y="315" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="23" font-weight="650" fill="#6E6E73" text-anchor="start">Start</text><rect x="205" y="277" width="56" height="58" rx="20" fill="#0A84FF" opacity="1"/><rect x="279" y="277" width="72" height="58" rx="20" fill="#BF5AF2" opacity="1"/><rect x="369" y="277" width="88" height="58" rx="20" fill="#FF453A" opacity="1"/><text x="75" y="445" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="23" font-weight="650" fill="#6E6E73" text-anchor="start">Middle</text><rect x="205" y="407" width="56" height="58" rx="20" fill="#0A84FF" opacity="1"/><rect x="279" y="407" width="72" height="58" rx="20" fill="#BF5AF2" opacity="1"/><rect x="369" y="407" width="88" height="58" rx="20" fill="#FF453A" opacity="1"/><text x="75" y="575" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="23" font-weight="650" fill="#6E6E73" text-anchor="start">Near failure</text><rect x="205" y="537" width="56" height="58" rx="20" fill="#0A84FF" opacity="1"/><rect x="279" y="537" width="72" height="58" rx="20" fill="#BF5AF2" opacity="1"/><rect x="369" y="537" width="88" height="58" rx="20" fill="#FF453A" opacity="1"/><text x="495" y="315" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="23" font-weight="650" fill="#6E6E73" text-anchor="start">Start</text><rect x="625" y="277" width="56" height="58" rx="20" fill="#0A84FF" opacity="1"/><rect x="699" y="277" width="72" height="58" rx="20" fill="#E5E5EA" opacity="0.75"/><rect x="789" y="277" width="88" height="58" rx="20" fill="#E5E5EA" opacity="0.75"/><text x="495" y="445" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="23" font-weight="650" fill="#6E6E73" text-anchor="start">Middle</text><rect x="625" y="407" width="56" height="58" rx="20" fill="#0A84FF" opacity="1"/><rect x="699" y="407" width="72" height="58" rx="20" fill="#BF5AF2" opacity="1"/><rect x="789" y="407" width="88" height="58" rx="20" fill="#E5E5EA" opacity="0.75"/><text x="495" y="575" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="23" font-weight="650" fill="#6E6E73" text-anchor="start">Near failure</text><rect x="625" y="537" width="56" height="58" rx="20" fill="#0A84FF" opacity="1"/><rect x="699" y="537" width="72" height="58" rx="20" fill="#BF5AF2" opacity="1"/><rect x="789" y="537" width="88" height="58" rx="20" fill="#FF453A" opacity="1"/></svg>