<svg xmlns="http://www.w3.org/2000/svg" width="900" height="780" viewBox="0 0 900 780" role="img" aria-labelledby="03_resistance_strength_muscle_length-t 03_resistance_strength_muscle_length-d" preserveAspectRatio="xMidYMid meet"><title id="03_resistance_strength_muscle_length-t">Resistance curve, strength curve and muscle length</title><desc id="03_resistance_strength_muscle_length-d">Three separate things plotted across a joint's range: the resistance curve, which is how much the exercise demands at each point; the strength curve, which is how much force the joint can produce at each point; and muscle length. They are different properties and they do not have to peak at the same point in the range.</desc><defs>
            <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1D1D1F"/></marker>
            <marker id="barr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0A84FF"/></marker>
            <marker id="rarr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#FF453A"/></marker>
            </defs><line x1="80" y1="520" x2="600" y2="520" stroke="#8E8E93" stroke-width="2" stroke-linecap="round"/><line x1="80" y1="100" x2="80" y2="520" stroke="#8E8E93" stroke-width="2" stroke-linecap="round"/><path d="M 80,490 C 210,510 270,180 340,170 C 425,180 500,470 600,485" fill="none" stroke="#0A84FF" stroke-width="7"/><path d="M 80,400 C 220,390 310,260 400,250 C 490,240 550,400 600,410" fill="none" stroke="#FF453A" stroke-width="6" stroke-dasharray="14 10"/><text x="635" y="150" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="32" font-weight="700" fill="#0A84FF" text-anchor="start">External demand</text><text x="635" y="190" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="25" font-weight="500" fill="#6E6E73" text-anchor="start">resistance curve</text><text x="635" y="275" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="32" font-weight="700" fill="#FF453A" text-anchor="start">Force capacity</text><text x="635" y="315" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="25" font-weight="500" fill="#6E6E73" text-anchor="start">example only</text><rect x="620" y="385" width="230" height="155" rx="22" fill="#F0F9F3"/><text x="650" y="425" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="32" font-weight="700" fill="#30D158" text-anchor="start">Muscle length</text><text x="650" y="470" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="27" font-weight="600" fill="#30D158" text-anchor="start">bottom: long</text><text x="650" y="510" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="27" font-weight="600" fill="#30D158" text-anchor="start">top: short</text><text x="80" y="565" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="28" font-weight="600" fill="#6E6E73" text-anchor="start">Bottom</text><text x="340" y="565" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="28" font-weight="600" fill="#6E6E73" text-anchor="middle">Mid-range</text><text x="600" y="565" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="28" font-weight="600" fill="#6E6E73" text-anchor="end">Top</text><text x="450" y="690" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="30" font-weight="700" fill="#30D158" text-anchor="middle">related, but not the same thing</text></svg>