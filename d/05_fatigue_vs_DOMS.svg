<svg xmlns="http://www.w3.org/2000/svg" width="900" height="880" viewBox="0 0 900 880" role="img" aria-labelledby="05_fatigue_vs_DOMS-t 05_fatigue_vs_DOMS-d" preserveAspectRatio="xMidYMid meet"><title id="05_fatigue_vs_DOMS-t">Fatigue during a set and soreness afterwards</title><desc id="05_fatigue_vs_DOMS-d">Two timelines side by side. Fatigue within a set runs over seconds and minutes while the set is happening and clears within about a day. Delayed-onset soreness builds over hours and peaks a day or two after the session. They are different processes on different clocks, and the soreness pathway is labelled a working model rather than a settled one.</desc><defs>
            <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1D1D1F"/></marker>
            <marker id="barr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0A84FF"/></marker>
            <marker id="rarr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#FF453A"/></marker>
            </defs><text x="55" y="80" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="36" font-weight="700" fill="#0A84FF" text-anchor="start">During the set</text><rect x="55" y="125" width="160" height="110" rx="22" fill="#EEF6FF"/><text x="135" y="168" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="23" font-weight="700" fill="#1D1D1F" text-anchor="middle">Repeated reps</text><line x1="215" y1="180" x2="250" y2="180" stroke="#0A84FF" stroke-width="3" stroke-linecap="round" marker-end="url(#barr)"/><rect x="265" y="125" width="160" height="110" rx="22" fill="#EEF6FF"/><text x="345" y="168" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="23" font-weight="700" fill="#1D1D1F" text-anchor="middle">Force</text><text x="345" y="200" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="23" font-weight="700" fill="#1D1D1F" text-anchor="middle">capacity</text><text x="345" y="232" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="23" font-weight="700" fill="#1D1D1F" text-anchor="middle">falls</text><line x1="425" y1="180" x2="460" y2="180" stroke="#0A84FF" stroke-width="3" stroke-linecap="round" marker-end="url(#barr)"/><rect x="475" y="125" width="160" height="110" rx="22" fill="#EEF6FF"/><text x="555" y="168" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="23" font-weight="700" fill="#1D1D1F" text-anchor="middle">Neural drive</text><text x="555" y="200" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="23" font-weight="700" fill="#1D1D1F" text-anchor="middle">rises</text><line x1="635" y1="180" x2="670" y2="180" stroke="#0A84FF" stroke-width="3" stroke-linecap="round" marker-end="url(#barr)"/><rect x="685" y="125" width="160" height="110" rx="22" fill="#EEF6FF"/><text x="765" y="168" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="23" font-weight="700" fill="#1D1D1F" text-anchor="middle">Task limit</text><text x="55" y="285" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="27" font-weight="500" fill="#6E6E73" text-anchor="start">Burn = metabolites from hard work, not next-day soreness.</text><text x="55" y="390" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="36" font-weight="700" fill="#30D158" text-anchor="start">After the session</text><text x="55" y="432" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="24" font-weight="700" fill="#FF9F0A" text-anchor="start">working model — exact DOMS pathway unsettled</text><rect x="55" y="475" width="160" height="135" rx="22" fill="#F0F9F3"/><text x="135" y="512" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="21" font-weight="700" fill="#1D1D1F" text-anchor="middle">Unfamiliar /</text><text x="135" y="541" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="21" font-weight="700" fill="#1D1D1F" text-anchor="middle">eccentric load</text><line x1="215" y1="542" x2="250" y2="542" stroke="#30D158" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><rect x="265" y="475" width="160" height="135" rx="22" fill="#F0F9F3"/><text x="345" y="512" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="21" font-weight="700" fill="#1D1D1F" text-anchor="middle">Tissue</text><text x="345" y="541" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="21" font-weight="700" fill="#1D1D1F" text-anchor="middle">disturbance may</text><text x="345" y="570" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="21" font-weight="700" fill="#1D1D1F" text-anchor="middle">occur</text><line x1="425" y1="542" x2="460" y2="542" stroke="#30D158" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><rect x="475" y="475" width="160" height="135" rx="22" fill="#F0F9F3"/><text x="555" y="512" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="21" font-weight="700" fill="#1D1D1F" text-anchor="middle">Pain-</text><text x="555" y="541" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="21" font-weight="700" fill="#1D1D1F" text-anchor="middle">sensitising</text><text x="555" y="570" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="21" font-weight="700" fill="#1D1D1F" text-anchor="middle">processes</text><line x1="635" y1="542" x2="670" y2="542" stroke="#30D158" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><rect x="685" y="475" width="160" height="135" rx="22" fill="#F0F9F3"/><text x="765" y="512" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="21" font-weight="700" fill="#1D1D1F" text-anchor="middle">DOMS often</text><text x="765" y="541" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="21" font-weight="700" fill="#1D1D1F" text-anchor="middle">peaks 24–72 h</text><rect x="55" y="700" width="790" height="78" rx="24" fill="#FFF7ED"/><text x="450" y="748" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Arial, sans-serif' font-size="32" font-weight="700" fill="#FF9F0A" text-anchor="middle">Soreness is not a scorecard.</text></svg>